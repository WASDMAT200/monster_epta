<title>Сеня, с днём рождения</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root {
  --void: #030205;
  --bone: #c2bdcb;
  --dim: #50485d;
  --blood: #e6001a;
  --cyan: #00f0c8;
  --f-px: "VT323", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background-color: var(--void); min-height: 100%; }

::selection { background: var(--blood); color: #fff; }

/* ── ЖИВОЙ ШУМОВОЙ ФОН ── */
#bg {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  pointer-events: none;
  opacity: 0.5;
  mix-blend-mode: screen;
}

body {
  position: relative;
  background:
    radial-gradient(120% 90% at 50% 0%, #0b0714 0%, var(--void) 55%),
    var(--void);
  color: var(--bone);
  font-family: var(--f-px);
  font-size: 22px;
  line-height: 1;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

/* сканлинии + лёгкая цветовая аберрация страницы */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(10, 8, 14, 0) 50%, rgba(0, 0, 0, 0.55) 50%),
    linear-gradient(90deg, rgba(230, 0, 26, 0.028), rgba(0, 255, 190, 0.014), rgba(0, 70, 255, 0.028));
  background-size: 100% 3px, 5px 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.95;
  animation: crtFlicker 4.2s steps(12) infinite;
}

/* плавная бегущая тёмная полоса поверх всего — «прокрутка ленты» */
#rollband {
  position: fixed;
  left: 0; right: 0;
  height: 22vh;
  top: -25vh;
  background: linear-gradient(to bottom, transparent, rgba(0,0,0,.35) 40%, rgba(0,0,0,.5) 50%, rgba(0,0,0,.35) 60%, transparent);
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 4;
  animation: rollband 9s linear infinite;
}

/* виньетка */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 18%, rgba(0, 0, 0, 0.72) 68%, rgba(1, 1, 2, 0.985) 100%);
  pointer-events: none;
  z-index: 3;
}

@keyframes crtFlicker {
  0%, 100% { opacity: 0.95; }
  8% { opacity: 0.86; }
  9% { opacity: 0.97; }
  38% { opacity: 0.9; }
  62% { opacity: 1; }
  63% { opacity: 0.84; }
  64% { opacity: 0.96; }
}
@keyframes rollband {
  0% { top: -25vh; }
  100% { top: 110vh; }
}

:focus-visible { outline: 2px solid var(--blood); outline-offset: 4px; }
.col { position: relative; z-index: 5; max-width: 520px; margin: 0 auto; display: grid; gap: 40px; }

.tall { display: block; line-height: 1; height: 1em; transform: scaleY(2.3); transform-origin: 0 0; margin-bottom: 1.4em; white-space: nowrap; }

.meta { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--dim); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
.meta .rec { color: var(--blood); }
.meta b { color: var(--blood); font-weight: 400; animation: blink 0.9s steps(2) infinite; text-shadow: 0 0 8px var(--blood); display: inline-block; }
@keyframes blink { 50% { opacity: 0.1; } }

.snd { font: inherit; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--bone); background: rgba(8, 6, 12, 0.9); border: 1px solid #231c2d; padding: 5px 12px; cursor: pointer; backdrop-filter: blur(4px); transition: all .12s; }
.snd:hover { border-color: var(--blood); color: var(--blood); box-shadow: 0 0 10px rgba(230,0,26,.4); }
.snd[data-on="1"] { color: #fff; background: var(--blood); border-color: var(--blood); box-shadow: 0 0 14px rgba(230,0,26,.8); text-shadow: 0 0 4px #000; }

/* ── ОБЛОЖКА ── */
.cover { position: relative; width: 100%; aspect-ratio: 1; background: #000; overflow: hidden; border: 1px solid #1a1422; box-shadow: 0 0 45px rgba(0,0,0,0.98), inset 0 0 60px rgba(0,0,0,.6); }
.cover img, .cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cover img { object-fit: cover; filter: contrast(1.2) saturate(.75); }
.cover canvas { image-rendering: pixelated; }
.cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.4) 2px 3px), radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(0,0,0,.9) 100%); }

/* ── ЗАГОЛОВОК С ГЛИТЧЕМ ── */
h1 { margin: 0; font-weight: 400; font-size: clamp(34px, 11vw, 58px); letter-spacing: .04em; text-transform: uppercase; color: var(--bone); }
h1 .tall { position: relative; display: inline-block; }
h1 .tall::before, h1 .tall::after {
  content: attr(data-text);
  position: absolute;
  left: 0; top: 0;
  width: 100%;
  opacity: 0;
  pointer-events: none;
}
h1 .tall::before { color: var(--blood); text-shadow: 0 0 14px rgba(230,0,26,.8); animation: glitchA 3.1s steps(1) infinite; }
h1 .tall::after  { color: var(--cyan);  text-shadow: 0 0 14px rgba(0,240,200,.6); animation: glitchB 2.7s steps(1) infinite; }
h1 .tall:nth-child(2) { color: var(--blood); text-shadow: 0 0 16px rgba(230,0,26,.8); }
h1 .tall:nth-child(2)::before { color: var(--bone); animation-duration: 2.3s; }
h1 .tall:nth-child(2)::after  { animation-duration: 3.7s; }

@keyframes glitchA {
  0%, 86%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
  87% { opacity: .9; transform: translate(-4px, 1px); clip-path: inset(12% 0 58% 0); }
  89% { opacity: .9; transform: translate(3px, -1px); clip-path: inset(55% 0 8% 0); }
  91% { opacity: .9; transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); }
  93% { opacity: 0; }
}
@keyframes glitchB {
  0%, 78%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
  79% { opacity: .8; transform: translate(4px, -1px); clip-path: inset(42% 0 22% 0); }
  82% { opacity: .8; transform: translate(-3px, 1px); clip-path: inset(8% 0 70% 0); }
  85% { opacity: 0; }
}
h1 .tall { transform: scaleY(2.3); }
.sub { color: var(--dim); font-size: 20px; letter-spacing: .15em; text-transform: uppercase; margin: 0; }

/* ── ТРЕКЛИСТ ── */
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
li { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: start; gap: 8px; padding-block: 7px 1px; border-top: 1px solid rgba(255,255,255,0.06); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .15s; }
li .n { color: var(--dim); font-size: 20px; transition: color .15s; }
li .t { font-size: 34px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone); transition: color .15s, text-shadow .15s; }
li .t.tall { margin-bottom: 1.15em; }
li .bar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--blood); box-shadow: 0 0 10px var(--blood); pointer-events: none; }
/* бегущая подсветка строки */
li::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(230,0,26,.10), transparent 70%); opacity: 0; transition: opacity .15s; pointer-events: none; }
li:hover::before, li:focus-visible::before, li[data-play="1"]::before { opacity: 1; }
li:hover .t, li:focus-visible .t, li[data-play="1"] .t { color: var(--blood); text-shadow: 0 0 12px rgba(230,0,26,.85); animation: shake .12s steps(2) infinite; }
li:hover .n, li:focus-visible .n, li[data-play="1"] .n { color: var(--blood); }
li[data-err="1"] .t { color: var(--dim); text-decoration: line-through; animation: none !important; }

@keyframes shake {
  0%  { transform: scaleY(2.3) translate(-3px, 1px); }
  50% { transform: scaleY(2.3) translate(3px, -1px); }
  100%{ transform: scaleY(2.3) translate(-1px, 1px); }
}

.end { color: var(--dim); font-size: 20px; letter-spacing: .14em; text-transform: uppercase; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .meta b, li:hover .t, li:focus-visible .t, h1 .tall::before, h1 .tall::after,
  body::before, #rollband { animation: none !important; }
}
</style>

<canvas id="bg"></canvas>
<div id="rollband"></div>

<div class="col">
  <div class="meta">
    <span class="rec">REC <b>●</b>&nbsp;</span>
    <button class="snd" id="snd" type="button" data-on="0">винил: выкл</button>
  </div>

  <div class="cover" id="cover">
    <img id="still" src="photo.jpg" alt="Обложка">
    <canvas id="cv" width="640" height="640" aria-hidden="true"></canvas>
  </div>

  <h1>
    <span class="tall" data-text="С ДНЁМ">С ДНЁМ</span><span class="tall" data-text="РОЖДЕНИЯ">РОЖДЕНИЯ</span>
  </h1>

  <p class="sub">9 треков · нажми на название</p>

  <ol id="tracks">
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">01</span><span class="t tall">жесть</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">02</span><span class="t tall">тише</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">03</span><span class="t tall">правила</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">04</span><span class="t tall">салфетка</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">05</span><span class="t tall">стигмата</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">06</span><span class="t tall">тело</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">07</span><span class="t tall">адреналин</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">08</span><span class="t tall">кусаю пальцы</span><i class="bar"></i></li>
    <li tabindex="0" role="button" aria-pressed="false"><span class="n">09</span><span class="t tall">hbd</span><i class="bar"></i></li>
  </ol>

</div>

<script>
(function () {
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TRACKS = ["01.mp3","02.mp3","03.mp3","04.mp3","05.mp3","06.mp3","07.mp3","08.mp3","09.mp3"];

  /* ───────── ШУМОВОЙ ФОН (rAF, переиспользуем буфер) ───────── */
  var bgCv = document.getElementById("bg");
  var bgCtx = bgCv.getContext("2d");
  var bw = 256, bh = 256;
  bgCv.width = bw; bgCv.height = bh;
  var noiseImg = bgCtx.createImageData(bw, bh);
  var nd = noiseImg.data;
  var trackY = 0, bgLast = 0;

  function renderBg(now) {
    if (now - bgLast < 50) return;
    bgLast = now;
    for (var i = 0; i < nd.length; i += 4) {
      var n = (Math.random() * 95) | 0;
      nd[i] = n + 6; nd[i+1] = n + 8; nd[i+2] = n + 14; nd[i+3] = 255;
    }
    trackY = (trackY + 3) % bh;
    for (var ty = trackY; ty < trackY + 12 && ty < bh; ty++) {
      for (var tx = 0; tx < bw; tx++) {
        var idx = (ty * bw + tx) * 4;
        var g = (Math.random() * 150 + 40) | 0;
        nd[idx] = g; nd[idx+1] = g; nd[idx+2] = g + 25;
      }
    }
    bgCtx.putImageData(noiseImg, 0, 0);
  }

  /* ───────── ОБЛОЖКА: RGB-РАЗДЕЛЕНИЕ + РОЛЛ + ПИКСЕЛИЗАЦИЯ ───────── */
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var cover = document.getElementById("cover"), still = document.getElementById("still");
  var W = cv.width, H = cv.height;
  var src = new Image();

  // офскрины для цветовых каналов
  function mkLayer(tint) {
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    return { cv: c, ctx: x, tint: tint };
  }
  var layerR = mkLayer("#ff0033"), layerC = mkLayer("#00f0c8"), layerBase = mkLayer(null);

  var small = document.createElement("canvas"), sctx = small.getContext("2d");
  var intensity = 0.45, targetI = 0.45, baseI = 0.45;
  var burstUntil = 0, pixelUntil = 0, zoomUntil = 0, nextBurst = 0, nextZoom = 0;
  var rollY = -1, rollSpeed = 0;
  var strips = [];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function newStrips(power) {
    strips = [];
    var n = 4 + Math.floor(power * 14);
    for (var i = 0; i < n; i++) strips.push({ y: rnd(0, H), h: rnd(6, 22 + power * 75), dx: rnd(-1, 1) * (18 + power * 70) });
  }

  function blitLayer(layer) {
    if (layer.tint) {
      layer.ctx.globalCompositeOperation = "source-over";
      layer.ctx.drawImage(src, 0, 0, W, H);
      layer.ctx.globalCompositeOperation = "multiply";
      layer.ctx.fillStyle = layer.tint;
      layer.ctx.fillRect(0, 0, W, H);
    } else {
      layer.ctx.drawImage(src, 0, 0, W, H);
    }
  }

  function draw(now, dt) {
    var I = intensity = lerp(intensity, targetI, Math.min(1, dt * 0.004));
    // «дыхание» — мягкая синусоидальная дрожь поверх интенсивности
    var wob = (Math.sin(now * 0.004) * 0.5 + Math.sin(now * 0.011) * 0.5) * (0.5 + I);
    var j = 1 + I * 6 + wob * 1.5;
    var ox = rnd(-j, j), oy = rnd(-j, j);

    blitLayer(layerBase); blitLayer(layerR); blitLayer(layerC);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    var chroma = 1 + I * 5 + Math.abs(wob) * 2; // сила расхождения каналов

    if (now < zoomUntil) {
      var cs = src.width * 0.28, cx = src.width * 0.455 - cs / 2, cy = src.height * 0.31 - cs / 2;
      ctx.imageSmoothingEnabled = true;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 1;
      ctx.drawImage(layerBase.cv, cx, cy, cs, cs, ox - chroma, oy - chroma, W + chroma * 2, H + chroma * 2);
      ctx.globalAlpha = 0.55;
      ctx.drawImage(layerR.cv, cx, cy, cs, cs, ox - chroma, oy, W + chroma, H + chroma);
      ctx.drawImage(layerC.cv, cx, cy, cs, cs, ox + chroma, oy, W + chroma, H + chroma);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    } else {
      var burst = now < burstUntil;
      ctx.imageSmoothingEnabled = true;

      // базовый кадр с небольшим overscan-дрожанием
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 1;
      ctx.drawImage(layerBase.cv, ox - j, oy - j, W + j * 2, H + j * 2);
      // постоянное лёгкое расхождение R/C каналов
      ctx.globalAlpha = 0.28 + I * 0.3;
      ctx.drawImage(layerR.cv, ox - j - chroma, oy - j, W + j * 2, H + j * 2);
      ctx.drawImage(layerC.cv, ox - j + chroma, oy - j, W + j * 2, H + j * 2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";

      if (burst) {
        // срезы с горизонтальным сдвигом — по всем каналам
        for (var i = 0; i < strips.length; i++) {
          var s = strips[i];
          ctx.drawImage(layerBase.cv, 0, s.y / H * H, W, s.h, s.dx * 0.6, s.y, W, s.h);
          ctx.globalAlpha = 0.5;
          ctx.globalCompositeOperation = "lighter";
          ctx.drawImage(layerR.cv, 0, s.y, W, s.h, s.dx + chroma, s.y, W, s.h);
          ctx.drawImage(layerC.cv, 0, s.y, W, s.h, s.dx - chroma, s.y, W, s.h);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }
        ctx.fillStyle = "rgba(230,0,26,.10)";
        ctx.fillRect(0, 0, W, H);
      }

      // пробегающая «дорожка» синхронизации — мягкий вертикальный ролл
      if (rollY >= 0) {
        rollY += rollSpeed * dt * 0.06;
        if (rollY > H + 80) rollY = -1;
        else {
          var rh = 46 + I * 60;
          var grad = ctx.createLinearGradient(0, rollY - rh, 0, rollY + rh);
          grad.addColorStop(0, "rgba(255,255,255,0)");
          grad.addColorStop(0.5, "rgba(255,255,255,0.10)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, rollY - rh, W, rh * 2);
        }
      }
    }

    if (now < pixelUntil) {
      var px = 32;
      small.width = px; small.height = px;
      sctx.imageSmoothingEnabled = true;
      sctx.drawImage(cv, 0, 0, px, px);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(small, 0, 0, px, px, 0, 0, W, H);
    }
  }

  var lastT = 0;
  function loop(now) {
    var dt = Math.min(50, now - lastT || 16);
    lastT = now;
    var I = intensity;
    if (now > nextBurst) {
      newStrips(Math.random() * 0.65 + I * 0.35);
      burstUntil = now + rnd(120, 420);
      if (Math.random() < 0.4) pixelUntil = now + rnd(80, 220);
      nextBurst = now + rnd(1200, 3600) * (1.2 - I * 0.7);
    }
    if (now > nextZoom) {
      zoomUntil = now + rnd(90, 180);
      nextZoom = now + rnd(6000, 13000);
    }
    if (rollY < 0 && Math.random() < 0.006 + I * 0.01) {
      rollY = -80; rollSpeed = rnd(2, 5);
    }
    renderBg(now);
    try { draw(now, dt); } catch (e) { return; }
    requestAnimationFrame(loop);
  }

  src.onload = function () {
    if (reduce) { cv.style.display = "none"; return; }
    try { draw(0, 16); still.style.visibility = "hidden"; } catch (e) { cv.style.display = "none"; return; }
    nextBurst = performance.now() + 800;
    nextZoom = performance.now() + 4500;
    requestAnimationFrame(loop);
  };
  src.onerror = function () { cv.style.display = "none"; };
  src.src = still.getAttribute("src");

  function near(x, y) {
    var r = cover.getBoundingClientRect();
    var d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    var max = Math.max(window.innerWidth, window.innerHeight) * 0.6;
    targetI = Math.max(0.45, Math.min(1, 1.1 - d / max));
  }
  window.addEventListener("pointermove", function (e) { near(e.clientX, e.clientY); }, { passive: true });

  /* ───────── ВИНИЛОВЫЙ ШУМ ───────── */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, vinylGain = null, vinylSource = null;
  var vinylOn = false;
  var sndBtn = document.getElementById("snd");

  function buildVinylBuffer(context) {
    var sr = context.sampleRate;
    var dur = 5;
    var len = Math.floor(sr * dur);
    var buf = context.createBuffer(2, len, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      var last = 0;
      for (var i = 0; i < len; i++) {
        var white = Math.random() * 2 - 1;
        last = (last * 0.88) + (white * 0.12);
        d[i] = last * 0.18;
      }
      var numClicks = Math.floor(dur * 40);
      for (var c = 0; c < numClicks; c++) {
        var pos = Math.floor(Math.random() * (len - 100));
        var clickAmp = Math.pow(Math.random(), 4) * 0.8 + 0.15;
        var dir = Math.random() < 0.5 ? 1 : -1;
        for (var k = 0; k < 12; k++) d[pos + k] += dir * clickAmp * Math.exp(-k / 2.5);
      }
      var numPops = Math.floor(dur * 6);
      for (var p = 0; p < numPops; p++) {
        var ppos = Math.floor(Math.random() * (len - 800));
        var popAmp = (Math.random() * 0.6 + 0.3);
        for (var pk = 0; pk < 600; pk++) d[ppos + pk] += popAmp * Math.sin(pk / 18) * Math.exp(-pk / 80);
      }
    }
    return buf;
  }

  function startAudioEngine() {
    if (!ac) { try { ac = new AC(); } catch (e) { return; } }
    if (ac.state === "suspended") ac.resume();
    if (!vinylSource) {
      try {
        var buffer = buildVinylBuffer(ac);
        vinylSource = ac.createBufferSource();
        vinylSource.buffer = buffer;
        vinylSource.loop = true;
        var lp = ac.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 6500;
        vinylGain = ac.createGain();
        vinylGain.gain.setValueAtTime(0, ac.currentTime);
        vinylSource.connect(lp); lp.connect(vinylGain); vinylGain.connect(ac.destination);
        vinylSource.start(0);
      } catch (e) {}
    }
  }

  function updateVinylVolume() {
    if (!ac) return;
    if (!vinylGain) startAudioEngine();
    if (!vinylGain) return;
    var now = ac.currentTime;
    var target = vinylOn ? (current >= 0 ? 0.45 : 0.85) : 0;
    vinylGain.gain.cancelScheduledValues(now);
    vinylGain.gain.setTargetAtTime(target, now, 0.08);
    sndBtn.setAttribute("data-on", vinylOn ? "1" : "0");
    sndBtn.textContent = vinylOn ? "винил: вкл" : "винил: выкл";
  }

  sndBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    startAudioEngine();
    vinylOn = !vinylOn;
    updateVinylVolume();
  });

  /* ───────── ПЛЕЕР ───────── */
  var rows = Array.prototype.slice.call(document.querySelectorAll("#tracks li"));
  var audios = [], current = -1;

  function setRow(i, playing) {
    var row = rows[i], n = row.querySelector(".n");
    row.setAttribute("data-play", playing ? "1" : "0");
    row.setAttribute("aria-pressed", playing ? "true" : "false");
    n.textContent = playing ? ">>" : (i < 9 ? "0" : "") + (i + 1);
    if (!playing) row.querySelector(".bar").style.width = "0";
  }

  function stopAll() {
    if (current >= 0) {
      var a = audios[current];
      if (a) { a.pause(); a.currentTime = 0; }
      setRow(current, false);
    }
    current = -1;
    baseI = 0.45;
    updateVinylVolume();
  }

  function play(i) {
    startAudioEngine();
    if (current === i) { stopAll(); return; }
    stopAll();
    var a = audios[i];
    if (!a) {
      a = new Audio(TRACKS[i]);
      a.preload = "auto";
      a.addEventListener("timeupdate", function () {
        if (a.duration) rows[i].querySelector(".bar").style.width = (a.currentTime / a.duration * 100) + "%";
      });
      a.addEventListener("ended", function () {
        setRow(i, false); current = -1; baseI = 0.45; updateVinylVolume();
        if (i < rows.length - 1) play(i + 1);
      });
      a.addEventListener("error", function () {
        rows[i].setAttribute("data-err", "1"); setRow(i, false);
        if (current === i) { current = -1; baseI = 0.45; updateVinylVolume(); }
      });
      audios[i] = a;
    }
    rows[i].removeAttribute("data-err");
    current = i;
    setRow(i, true);
    baseI = 0.85;
    targetI = Math.max(targetI, 0.85);
    updateVinylVolume();
    var p = a.play();
    if (p && p.catch) {
      p.catch(function () {
        rows[i].setAttribute("data-err", "1");
        setRow(i, false);
        if (current === i) { current = -1; baseI = 0.45; updateVinylVolume(); }
      });
    }
  }

  rows.forEach(function (row, i) {
    row.addEventListener("click", function () { play(i); });
    row.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(i); }
    });
  });
})();
</script>

</body></html>
